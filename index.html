<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Application web de gestion des menus hebdomadaires de la cantine YouCode: planification des pages, gestion des recettes et suivi du budget quotidien.">
    <title>Cantine | Gestion des menus</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-['Inter',_sans-serif] bg-red-50">
<header class=" max-w-[1600] bg-white border-b border-slate-200 px-6 py-4">
    <div class="flex items-center gap-3">
        <img src="assets/images/cantine-logo.png" alt="cantina logo" class="w-14 h-14 object-conatin">
        <p><a href="#index" class="text-3xl font-bold text-[#601c00]">Cantina</a></p>
    </div>
</header>
<main class="max-w-[1600] px-6 py-4" id="index">
    <section id="statistique" class="grid grid-cols-4 gap-4 mb-6 pb-6 border-b border-slate-200">
        <article class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
            <h2 class="text-[#601c00] font-bold text-center pb-3">Recettes en réserve</h2>
            <p class="font-bold text-2xl text-center text-[#f9b332]">2</p>
        </article>
        <article class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
            <h2 class="text-[#601c00] font-bold text-center pb-3">Jour prête</h2>
            <p class="font-bold text-2xl text-center text-[#f9b332]">3/5</p>
        </article>
        <article class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
            <h2 class="text-[#601c00] font-bold text-center pb-3">Coût de la semaine</h2>
            <p class="font-bold text-2xl text-center text-[#f9b332]">250 DH</p>
        </article>
        <article class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
            <h2 class="text-[#601c00] font-bold text-center pb-3">Équilibre alimentaire</h2>
            <p class="font-bold text-2xl text-center text-[#f9b332]">Équilibre</p>
        </article>
    </section>
</main>
<footer>

</footer>
    
</body>
</html>
